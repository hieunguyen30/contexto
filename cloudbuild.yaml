# Build -> push to Artifact Registry -> roll new images out to Cloud Run.
#
# Terraform (infra/) owns all configuration: service accounts, env vars, secrets, scaling, IAM, Pub/Sub.
# This pipeline only ships images, so `gcloud run deploy` here passes nothing but --image.
#
# Run as the Terraform-created deployer account:
#   gcloud builds submit --config cloudbuild.yaml \
#     --service-account=projects/<project>/serviceAccounts/contexto-build@<project>.iam.gserviceaccount.com \
#     --substitutions=SHORT_SHA=<sha>,_BACKEND_URL=<backend_url output>,_FIREBASE_API_KEY=...,_FIREBASE_AUTH_DOMAIN=...,_FIREBASE_APP_ID=...
substitutions:
  _REGION: us-central1
  _REPO: contexto
  # `terraform output backend_url`; baked into the frontend bundle at build time.
  _BACKEND_URL: ''
  # Firebase web config (public identifiers, not secrets): Firebase console -> Project settings.
  _FIREBASE_API_KEY: ''
  _FIREBASE_AUTH_DOMAIN: ''
  _FIREBASE_APP_ID: ''

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA', 'backend']
  - id: build-worker
    name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'backend/worker/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/worker:$SHORT_SHA', 'backend']
    waitFor: ['-']
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_BACKEND_URL}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=$PROJECT_ID
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - frontend
    waitFor: ['-']
  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA']
    waitFor: ['build-backend']
  - id: push-worker
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/worker:$SHORT_SHA']
    waitFor: ['build-worker']
  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA']
    waitFor: ['build-frontend']
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ['run', 'deploy', 'contexto-backend', '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA', '--region=${_REGION}']
    waitFor: ['push-backend']
  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ['run', 'deploy', 'contexto-worker', '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/worker:$SHORT_SHA', '--region=${_REGION}']
    waitFor: ['push-worker']
  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ['run', 'deploy', 'contexto-frontend', '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA', '--region=${_REGION}']
    waitFor: ['push-frontend']
  - id: deploy-reviews-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ['run', 'jobs', 'update', 'contexto-reviews-due', '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA', '--region=${_REGION}']
    waitFor: ['push-backend']

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/worker:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA
